# ------------------------------------------------------------------ includes
[include.optional]
files = ["noctalia.toml"]

# ------------------------------------------------------------------- session
[general]
autostart = ["noctalia"]
xwayland = true
xwayland_native_resolution = true
xwayland_xsettings = true
attach_modal_dialogs = true
mod_key = "Super"
show_cheatsheet = false
focus_on_activate = false
honor_restored_maximize = false

# ------------------------------------------------------------------- outputs
[output."Chimei Innolux Corporation 0x14D1 Unknown"]

# --------------------------------------------------------------------- input
[input.keyboard]
layout = "us,th"
repeat_rate = 25
repeat_delay = 400
numlock_toggle = true
track_layout = "global"

[input.touchpad]
natural_scroll = true

[input.mouse]
natural_scroll = true
accel_profile = "flat"
sensitivity = -0.88

[input.focus]
follows_mouse = "sloppy"
follows_mouse_max_scroll = 0.33

[input.drag_edge_scroll]
enabled = true
trigger_zone = 30
delay_ms = 100
max_speed = 1500.0

[input.cursor]
theme = "mizuki-psekai-cursor"
size = 32
hide_when_typing = true
hide_timeout_ms = 5000
hide_on_touch = true

# ---------------------------------------------------------------- appearance
[appearance]
prefer_no_csd = true
border_width = 0
outer_border_width = 0
corner_radius = 20
drag_opacity = 0.75
opaque_fullscreen = true

[appearance.blur]
enabled = true
optimized = true
passes = 2
radius = 5
noise = 0.02
brightness = 0.9
contrast = 0.9
saturation = 1.1

[appearance.shadow]
enabled = true
softness = 15
offset_x = 0
offset_y = 0

[appearance.title_bar]
mode = "off"
height = 26
font = "Inter Medium 10"
title_align = "center"
button_position = "left"
buttons = ["minimize", "maximize", "close"]
button_size = -1
button_gap = 6
button_padding = 10
button_corner_radius = -1
button_glyph = "hover"
button_glyph_size = -1
button_glyph_stroke = -1
button_background = true

[appearance.tab_bar]
style = "indicator"
height = 10
padding = 10
position = "top"
gap = -1
font = "Inter Medium 10"
visible = true
hide_when_single = false
max_tabs = 6
overflow = "scroll"

# -------------------------------------------------------------------- layout
[layout]
gap = 6
mode = "scrolling"
extent_presets = [0.5, 0.75, 0.93, 1.00]
client_maximize = "column"

[layout.dwindle]
preserve_split = false
new_toward_cursor = true

[layout.stacking]

[layout.master]
position = "left"
default_width_fraction = 0.60
new_becomes_master = false

[layout.scrolling]
default_extent_fraction = 0.75
center_on_overview_select = true

[layout.tabs]
default_display = "normal"
middle_click_closes = true

# ---------------------------------------------------------------- workspaces
[workspaces]
back_and_forth = true
empty_above = false

# ------------------------------------------------------------------ overview
[overview]
zoom = 0.65
scroll_factor_horizontal = 1.0
scroll_factor_vertical = 1.0
shortcut_keys = "dfjk"

# --------------------------------------------------------------- hot corners
[hot_corners.top_left]
enabled = true
delay_ms = 100
action = "overview-open"

[hot_corners.top_right]
enabled = true
delay_ms = 100
action = "spawn noctalia msg window-switcher"

[hot_corners.bottom_left]
enabled = true
delay_ms = 100
action = "window-focus-left"

[hot_corners.bottom_right]
enabled = true
delay_ms = 100
action = "window-focus-right"

# ------------------------------------------------------------------ keybinds
